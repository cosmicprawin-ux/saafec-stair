    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function structurePanLimitForZoom(zoom) {
      const base = Math.min(structureState.width, structureState.height);
      const zoomAllowance = Math.max(0, zoom - 1) * 0.09;
      return Math.min(320, base * (0.25 + zoomAllowance));
    }

    function structurePanLimit() {
      return structurePanLimitForZoom(structureState.zoom);
    }

    function clampStructurePan() {
      const limit = structurePanLimit();
      structureState.panX = clamp(structureState.panX, -limit, limit);
      structureState.panY = clamp(structureState.panY, -limit, limit);
    }

    function clampStructurePanForZoom(value, zoom) {
      const limit = structurePanLimitForZoom(zoom);
      return clamp(value, -limit, limit);
    }

    function panStructure(dx, dy) {
      structureState.panX += dx;
      structureState.panY += dy;
      clampStructurePan();
    }

    function mix(a, b, t) {
      return Math.round(a + (b - a) * t);
    }

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      return [
        parseInt(normalized.slice(0, 2), 16),
        parseInt(normalized.slice(2, 4), 16),
        parseInt(normalized.slice(4, 6), 16)
      ];
    }

    function rgbToHex(rgb) {
      return `#${rgb.map(channel => channel.toString(16).padStart(2, "0")).join("")}`;
    }

    function colorFor(value) {
      if (!isFiniteValue(value)) return "#111827";
      if (Math.abs(value) < 1e-9) return "#fff8e8";
      const neutral = hexToRgb("#fff8e8");
      if (value < 0) {
        const green = hexToRgb("#0e7b3a");
        const t = Math.pow(clamp(Math.abs(value) / colorScale, 0, 1), 0.72);
        return rgbToHex([mix(neutral[0], green[0], t), mix(neutral[1], green[1], t), mix(neutral[2], green[2], t)]);
      }
      const red = hexToRgb("#b7221e");
      const t = Math.pow(clamp(value / colorScale, 0, 1), 0.72);
      return rgbToHex([mix(neutral[0], red[0], t), mix(neutral[1], red[1], t), mix(neutral[2], red[2], t)]);
    }

    function readableTextColor(backgroundHex) {
      const [red, green, blue] = hexToRgb(backgroundHex);
      const luminance = (0.299 * red) + (0.587 * green) + (0.114 * blue);
      return luminance < 150 ? "#ffffff" : "#17211b";
    }

    function elementColor(element) {
      const colors = {
        C: "#7b8580",
        N: "#2f65b0",
        O: "#be3b32",
        S: "#b38715",
        P: "#8c5da8"
      };
      return colors[element] || "#6f7b74";
    }

    function residueAtomsForSelection() {
      if (!selectedResidueIndex || !structure.atoms) return [];
      return structure.atoms.filter(atom => atom.seqIndex === selectedResidueIndex);
    }

    function atomByName(atoms, name) {
      return atoms.find(atom => atom.name === name) || null;
    }

    function vectorFrom(a, b) {
      return { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
    }

    function vectorAdd(a, b) {
      return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function vectorScale(v, scalar) {
      return { x: v.x * scalar, y: v.y * scalar, z: v.z * scalar };
    }

    function vectorLength(v) {
      return Math.hypot(v.x, v.y, v.z);
    }

    function vectorNormalize(v) {
      const length = vectorLength(v);
      if (length < 1e-6) return null;
      return { x: v.x / length, y: v.y / length, z: v.z / length };
    }

    function vectorDot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function vectorCross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function fallbackPerpendicular(v) {
      const reference = Math.abs(v.x) < 0.75 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 1, z: 0 };
      return vectorNormalize(vectorCross(v, reference)) || { x: 0, y: 0, z: 1 };
    }

    function stopStructureFocusAnimation() {
      if (!structureState.focusRaf) return;
      cancelAnimationFrame(structureState.focusRaf);
      structureState.focusRaf = null;
    }

    function stopStructureAutoRotation() {
      if (!structureState.auto) return;
      structureState.auto = false;
      spinButton.setAttribute("aria-pressed", "false");
      spinButton.textContent = "Auto";
      if (structureState.raf) {
        cancelAnimationFrame(structureState.raf);
        structureState.raf = null;
      }
    }

    function normalizeAngle(angle) {
      let normalized = angle;
      while (normalized > Math.PI) normalized -= Math.PI * 2;
      while (normalized < -Math.PI) normalized += Math.PI * 2;
      return normalized;
    }

    function angleToward(from, to, t) {
      return from + normalizeAngle(to - from) * t;
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function resizeStructureCanvas() {
      const rect = structureCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(200, Math.floor(rect.height || width * 0.75));
      structureState.width = width;
      structureState.height = height;
      structureState.dpr = dpr;
      structureCanvas.width = Math.floor(width * dpr);
      structureCanvas.height = Math.floor(height * dpr);
      structureContext.setTransform(dpr, 0, 0, dpr, 0, 0);
      clampStructurePan();
      drawStructure();
    }

    function rotatedPointWithAngles(atom, rotX, rotY) {
      const center = structure.center || [0, 0, 0];
      const x = atom.x - center[0];
      const y = atom.y - center[1];
      const z = atom.z - center[2];
      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);
      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;
      const y1 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;
      return { x: x1, y: y1, z: z2 };
    }

    function rotatedPoint(atom) {
      return rotatedPointWithAngles(atom, structureState.rotX, structureState.rotY);
    }

    function projectedPointWithState(atom, state) {
      const point = rotatedPointWithAngles(atom, state.rotX, state.rotY);
      const radius = structure.radius || 1;
      const camera = radius * 5.5;
      const perspective = camera / Math.max(1, camera - point.z);
      const scale = Math.min(structureState.width, structureState.height) * 0.42 / radius * state.zoom * perspective;
      return {
        point,
        scale,
        x: structureState.width / 2 + state.panX + point.x * scale,
        y: structureState.height / 2 + state.panY - point.y * scale
      };
    }

    function projectAtom(atom) {
      const projected = projectedPointWithState(atom, structureState);
      const point = projected.point;
      const radius = structure.radius || 1;
      return {
        atom,
        x: projected.x,
        y: projected.y,
        z: point.z,
        depth: clamp((point.z + radius) / (radius * 2), 0, 1)
      };
    }

    function residueFocusAtom() {
      const atoms = residueAtomsForSelection();
      return atomByName(atoms, "CA") || atoms[0] || null;
    }

    function residueFacingOrientation(atom) {
      const center = structure.center || [0, 0, 0];
      const vector = {
        x: atom.x - center[0],
        y: atom.y - center[1],
        z: atom.z - center[2]
      };
      const horizontal = Math.hypot(vector.x, vector.z);
      const length = Math.hypot(vector.x, vector.y, vector.z);
      if (length < 1e-6 || horizontal < 1e-6) {
        return { rotX: -0.72, rotY: 0.58 };
      }
      return {
        rotY: Math.atan2(-vector.x, vector.z),
        rotX: clamp(Math.atan2(vector.y, horizontal), -Math.PI * 0.92, Math.PI * 0.92)
      };
    }

    function structureFocusTarget(atom) {
      const faceOnOrientation = residueFacingOrientation(atom);
      const orientation = {
        rotX: clamp(faceOnOrientation.rotX + focusRevealPitch, -Math.PI * 0.92, Math.PI * 0.92),
        rotY: faceOnOrientation.rotY + focusRevealYaw
      };
      const zoom = clamp(structureHomeZoom * 1.72, 1.85, 2.45);
      const previewState = { ...structureState, ...orientation, zoom, panX: 0, panY: 0 };
      const projected = projectedPointWithState(atom, previewState);
      return {
        ...orientation,
        zoom,
        panX: clampStructurePanForZoom(structureState.width / 2 - projected.x, zoom),
        panY: clampStructurePanForZoom(structureState.height / 2 - projected.y, zoom)
      };
    }

    function focusStructureOnSelectedResidue(animate = true) {
      const atom = residueFocusAtom();
      if (!atom) {
        drawStructure();
        return;
      }

      stopStructureAutoRotation();
      stopStructureFocusAnimation();
      const target = structureFocusTarget(atom);
      const start = {
        rotX: structureState.rotX,
        rotY: structureState.rotY,
        zoom: structureState.zoom,
        panX: structureState.panX,
        panY: structureState.panY
      };

      if (!animate) {
        structureState.rotX = target.rotX;
        structureState.rotY = target.rotY;
        structureState.zoom = target.zoom;
        structureState.panX = target.panX;
        structureState.panY = target.panY;
        drawStructure();
        return;
      }

      const duration = 520;
      const startedAt = performance.now();
      function step(now) {
        const progress = clamp((now - startedAt) / duration, 0, 1);
        const eased = easeInOutCubic(progress);
        structureState.rotX = angleToward(start.rotX, target.rotX, eased);
        structureState.rotY = angleToward(start.rotY, target.rotY, eased);
        structureState.zoom = start.zoom + (target.zoom - start.zoom) * eased;
        structureState.panX = start.panX + (target.panX - start.panX) * eased;
        structureState.panY = start.panY + (target.panY - start.panY) * eased;
        drawStructure();
        if (progress < 1) {
          structureState.focusRaf = requestAnimationFrame(step);
        } else {
          structureState.focusRaf = null;
        }
      }
      structureState.focusRaf = requestAnimationFrame(step);
    }

    function buildMutantResidueOverlay() {
      if (!selectedResidueIndex || !selectedMutantAa || selectedMutantAa === selectedWildTypeAa) return null;
      const template = mutationSideChainTemplates[selectedMutantAa];
      if (!template) return null;

      const residueAtoms = residueAtomsForSelection();
      const ca = atomByName(residueAtoms, "CA");
      if (!ca) return null;

      const n = atomByName(residueAtoms, "N");
      const c = atomByName(residueAtoms, "C");
      const cb = atomByName(residueAtoms, "CB");
      const nDir = n ? vectorNormalize(vectorFrom(ca, n)) : null;
      const cDir = c ? vectorNormalize(vectorFrom(ca, c)) : null;
      let sideDir = cb ? vectorNormalize(vectorFrom(ca, cb)) : null;

      if (!sideDir && nDir && cDir) {
        sideDir = vectorNormalize(vectorCross(nDir, cDir));
      }
      if (!sideDir) sideDir = { x: 1, y: 0, z: 0 };

      let tangent = n && c ? vectorNormalize(vectorFrom(n, c)) : cDir;
      if (!tangent || Math.abs(vectorDot(tangent, sideDir)) > 0.86) {
        tangent = fallbackPerpendicular(sideDir);
      }
      let normal = vectorNormalize(vectorCross(sideDir, tangent));
      if (!normal) normal = fallbackPerpendicular(sideDir);
      tangent = vectorNormalize(vectorCross(normal, sideDir)) || tangent;

      function place(templateAtom) {
        const coord = templateAtom.coord;
        const displaced = vectorAdd(
          vectorAdd(vectorScale(sideDir, coord[0]), vectorScale(tangent, coord[1])),
          vectorScale(normal, coord[2])
        );
        return {
          name: templateAtom.name,
          element: templateAtom.element,
          seqIndex: selectedResidueIndex,
          x: ca.x + displaced.x,
          y: ca.y + displaced.y,
          z: ca.z + displaced.z,
          mutantOverlay: true
        };
      }

      return {
        atoms: [
          {
            name: "CA",
            element: "C",
            seqIndex: selectedResidueIndex,
            x: ca.x,
            y: ca.y,
            z: ca.z,
            mutantAnchor: true
          },
          ...template.atoms.map(place)
        ],
        bonds: template.bonds,
        hasSideChain: template.atoms.length > 0
      };
    }

    function drawMutantResidueOverlay() {
      const overlay = buildMutantResidueOverlay();
      if (!overlay) return;

      const ctx = structureContext;
      const projected = overlay.atoms.map(projectAtom);
      const byName = new Map(projected.map(item => [item.atom.name, item]));

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(105, 60, 190, 0.94)";
      ctx.lineWidth = 3.2;
      overlay.bonds.forEach(([from, to]) => {
        const a = byName.get(from);
        const b = byName.get(to);
        if (!a || !b) return;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      });
      ctx.restore();

      projected
        .slice()
        .sort((a, b) => a.z - b.z)
        .forEach(item => {
          const isAnchor = item.atom.mutantAnchor;
          const radius = isAnchor ? 5.2 + item.depth * 1.2 : 6.1 + item.depth * 1.6;
          ctx.save();
          ctx.fillStyle = isAnchor ? "rgba(255, 248, 232, 0.96)" : elementColor(item.atom.element);
          ctx.strokeStyle = "#6f3cc3";
          ctx.lineWidth = isAnchor ? 2.1 : 2.8;
          ctx.beginPath();
          ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
    }

    function drawStructureBackground() {
      const ctx = structureContext;
      ctx.clearRect(0, 0, structureState.width, structureState.height);
      ctx.fillStyle = "#f5f8f5";
      ctx.fillRect(0, 0, structureState.width, structureState.height);
      ctx.strokeStyle = "#dde4dd";
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, structureState.width - 1, structureState.height - 1);
    }

    function drawStructureLabel() {
      if (!selectedStructureLabel) return;
      const ctx = structureContext;
      const selectedText = selectedStructureLabel;
      ctx.save();
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      const width = Math.min(structureState.width - 20, ctx.measureText(selectedText).width + 22);
      ctx.fillStyle = "rgba(255, 255, 255, 0.90)";
      ctx.strokeStyle = "rgba(199, 209, 201, 0.95)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(10, 10, width, 30, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#17211b";
      ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText(selectedText, 21, 31, Math.max(20, width - 22));
      ctx.restore();
    }

    function drawSelectedBonds(projectedAtoms) {
      if (!selectedResidueIndex) return;
      const selected = projectedAtoms.filter(item => item.atom.seqIndex === selectedResidueIndex);
      const ctx = structureContext;
      ctx.save();
      ctx.strokeStyle = "rgba(23, 33, 27, 0.82)";
      ctx.lineWidth = 2.6;
      ctx.lineCap = "round";
      for (let i = 0; i < selected.length; i += 1) {
        for (let j = i + 1; j < selected.length; j += 1) {
          const a = selected[i].atom;
          const b = selected[j].atom;
          const distance = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
          if (distance > 0.7 && distance < 1.95) {
            ctx.beginPath();
            ctx.moveTo(selected[i].x, selected[i].y);
            ctx.lineTo(selected[j].x, selected[j].y);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function drawSmoothPath(points) {
      const ctx = structureContext;
      if (!points || points.length === 0) return;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      if (points.length === 1) {
        ctx.lineTo(points[0].x + 0.01, points[0].y + 0.01);
        return;
      }
      for (let index = 1; index < points.length - 1; index += 1) {
        const current = points[index];
        const next = points[index + 1];
        const midX = (current.x + next.x) / 2;
        const midY = (current.y + next.y) / 2;
        ctx.quadraticCurveTo(current.x, current.y, midX, midY);
      }
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
    }

    function ribbonBand(points, width) {
      if (!points || points.length < 2) return null;
      const left = [];
      const right = [];
      for (let index = 0; index < points.length; index += 1) {
        const previous = points[Math.max(0, index - 1)];
        const next = points[Math.min(points.length - 1, index + 1)];
        const dx = next.x - previous.x;
        const dy = next.y - previous.y;
        const length = Math.hypot(dx, dy) || 1;
        const nx = -dy / length;
        const ny = dx / length;
        const depthWidth = width * (0.82 + points[index].depth * 0.32);
        left.push({ x: points[index].x + nx * depthWidth, y: points[index].y + ny * depthWidth });
        right.push({ x: points[index].x - nx * depthWidth, y: points[index].y - ny * depthWidth });
      }
      return { left, right };
    }

    function drawSmoothOpen(points, shouldMove = true) {
      const ctx = structureContext;
      if (!points || points.length === 0) return;
      if (shouldMove) ctx.moveTo(points[0].x, points[0].y);
      else ctx.lineTo(points[0].x, points[0].y);
      for (let index = 1; index < points.length - 1; index += 1) {
        const current = points[index];
        const next = points[index + 1];
        ctx.quadraticCurveTo(current.x, current.y, (current.x + next.x) / 2, (current.y + next.y) / 2);
      }
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
    }

    function drawRibbon(backbone) {
      const ctx = structureContext;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(28, 51, 42, 0.16)";
      ctx.lineWidth = 19;
      drawSmoothPath(backbone);
      ctx.stroke();
      ctx.strokeStyle = "rgba(62, 129, 96, 0.90)";
      ctx.lineWidth = 12;
      drawSmoothPath(backbone);
      ctx.stroke();
      ctx.strokeStyle = "rgba(230, 244, 234, 0.78)";
      ctx.lineWidth = 3;
      drawSmoothPath(backbone);
      ctx.stroke();
      ctx.restore();
    }

    function drawTrace(backbone) {
      const ctx = structureContext;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(113, 128, 118, 0.72)";
      ctx.lineWidth = 3.2;
      drawSmoothPath(backbone);
      ctx.stroke();
      ctx.restore();
    }

    function drawSelectedHalo(backbone) {
      if (!selectedResidueIndex) return;
      const selectedCa = backbone.find(point => point.atom.seqIndex === selectedResidueIndex);
      if (!selectedCa) return;
      const ctx = structureContext;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.fillStyle = "rgba(247, 201, 72, 0.28)";
      ctx.strokeStyle = "rgba(36, 91, 115, 0.95)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(selectedCa.x, selectedCa.y, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawAllAtoms(projectedAtoms) {
      const ctx = structureContext;
      projectedAtoms.forEach(item => {
        const selected = item.atom.seqIndex === selectedResidueIndex;
        const radius = selected ? 5.3 + item.depth * 1.6 : 2.0 + item.depth * 1.1;
        ctx.save();
        ctx.globalAlpha = selected ? 1 : (structureState.mode === "both" ? 0.26 : 0.56);
        ctx.fillStyle = elementColor(item.atom.element);
        ctx.strokeStyle = selected ? "#f7c948" : "rgba(255, 255, 255, 0.65)";
        ctx.lineWidth = selected ? 2.4 : 0.7;
        ctx.beginPath();
        ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawSelectedAtoms(projectedAtoms) {
      if (!selectedResidueIndex) return;
      const ctx = structureContext;
      projectedAtoms
        .filter(item => item.atom.seqIndex === selectedResidueIndex)
        .forEach(item => {
          const radius = 5.8 + item.depth * 1.8;
          ctx.save();
          ctx.fillStyle = elementColor(item.atom.element);
          ctx.strokeStyle = "#f7c948";
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
    }

    function drawStructure() {
      drawStructureBackground();
      if (!structure.atoms || structure.atoms.length === 0) {
        structureContext.fillStyle = "#5f6d64";
        structureContext.font = "13px ui-sans-serif, system-ui, sans-serif";
        structureContext.fillText("No PDB structure loaded", 20, 34);
        return;
      }

      const backbone = structure.backbone.map(projectAtom);
      const projectedAtoms = structure.atoms.map(projectAtom).sort((a, b) => a.z - b.z);

      if (structureState.mode === "atoms") {
        drawTrace(backbone);
      } else {
        drawRibbon(backbone);
      }
      drawSelectedHalo(backbone);

      drawSelectedBonds(projectedAtoms);
      if (structureState.mode === "atoms" || structureState.mode === "both") {
        drawAllAtoms(projectedAtoms);
      } else {
        drawSelectedAtoms(projectedAtoms);
      }
      drawMutantResidueOverlay();

      drawStructureLabel();
    }

    function selectStructureResidue(row, aa, value, options = {}) {
      selectedResidueIndex = Number(row.index);
      selectedMutantAa = aa;
      selectedWildTypeAa = row.wildType;
      selectedMutationValue = value;
      selectedStructureLabel = isMissingResidue(row) || !isFiniteValue(value)
        ? "Missing residue"
        : `${row.wildType}${row.index}${aa} · ${formatValue(value)} kcal/mol`;
      if (options.focusView) {
        focusStructureOnSelectedResidue(true);
      } else {
        drawStructure();
      }
    }

    function clearSelection(redraw = true) {
      stopStructureFocusAnimation();
      selectedKey = null;
      selectedResidueIndex = null;
      selectedStructureLabel = "";
      selectedMutantAa = null;
      selectedWildTypeAa = null;
      selectedMutationValue = 0;

      renderResidueLookup();
      renderSequencePreview();

      drawStructure();
      if (redraw) {
        drawHeatmap();
      } else {
        svg.querySelectorAll(".cell.selected").forEach(cell => cell.classList.remove("selected"));
      }
    }

    function previewMutationInSelectedRow(rowIndex, aa) {
      if (!selectedResidueIndex) return;
      if (String(rowIndex) !== String(selectedResidueIndex)) return;
      if (selectedKey === `${rowIndex}:${aa}`) return;
      updateSelection(rowIndex, aa, false);
    }

    function pickResidueFromCanvas(event) {
      if (!structure.backbone || structure.backbone.length === 0) {
        clearSelection(true);
        return;
      }
      const rect = structureCanvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      let best = { distance: Infinity, atom: null };
      structure.backbone.map(projectAtom).forEach(point => {
        const distance = Math.hypot(point.x - x, point.y - y);
        if (distance < best.distance) best = { distance, atom: point.atom };
      });
      if (best.atom && best.distance <= 26) {
        updateSelection(best.atom.seqIndex, best.atom.wildType, true);
      } else {
        clearSelection(true);
      }
    }

    function setupStructureViewer() {
      resizeStructureCanvas();
      if (window.ResizeObserver) {
        new ResizeObserver(resizeStructureCanvas).observe(structureCanvas);
      } else {
        window.addEventListener("resize", resizeStructureCanvas);
      }

      structureCanvas.addEventListener("pointerdown", event => {
        stopStructureFocusAnimation();
        structureState.dragging = true;
        structureState.moved = false;
        structureState.lastX = event.clientX;
        structureState.lastY = event.clientY;
        structureState.startX = event.clientX;
        structureState.startY = event.clientY;
        structureCanvas.setPointerCapture(event.pointerId);
      });

      structureCanvas.addEventListener("pointermove", event => {
        if (!structureState.dragging) return;
        const dx = event.clientX - structureState.lastX;
        const dy = event.clientY - structureState.lastY;
        const panDrag = event.shiftKey || event.altKey || event.metaKey || event.buttons === 4;
        if (panDrag) {
          panStructure(dx, dy);
        } else {
          structureState.rotY += dx * 0.012;
          structureState.rotX = clamp(structureState.rotX + dy * 0.012, -Math.PI * 0.92, Math.PI * 0.92);
        }
        structureState.lastX = event.clientX;
        structureState.lastY = event.clientY;
        if (Math.hypot(event.clientX - structureState.startX, event.clientY - structureState.startY) > 5) {
          structureState.moved = true;
        }
        drawStructure();
      });

      structureCanvas.addEventListener("pointerup", event => {
        structureState.dragging = false;
        structureCanvas.releasePointerCapture(event.pointerId);
        if (!structureState.moved) pickResidueFromCanvas(event);
      });

      structureCanvas.addEventListener("wheel", event => {
        event.preventDefault();
        stopStructureFocusAnimation();
        const trackpadPan = !event.ctrlKey
          && !event.metaKey
          && event.deltaMode === 0
          && Math.max(Math.abs(event.deltaX), Math.abs(event.deltaY)) < 90;
        if (trackpadPan || event.shiftKey || event.altKey) {
          panStructure(-event.deltaX * 0.82, -event.deltaY * 0.82);
        } else {
          const direction = event.deltaY > 0 ? 0.92 : 1.08;
          structureState.zoom = clamp(structureState.zoom * direction, 0.55, 10.0);
          clampStructurePan();
        }
        drawStructure();
      }, { passive: false });

      spinButton.addEventListener("click", () => {
        stopStructureFocusAnimation();
        structureState.auto = !structureState.auto;
        spinButton.setAttribute("aria-pressed", String(structureState.auto));
        spinButton.textContent = structureState.auto ? "Stop" : "Auto";
        if (structureState.auto) animateStructure();
      });

      resetViewButton.addEventListener("click", () => {
        stopStructureFocusAnimation();
        structureState.rotX = -0.72;
        structureState.rotY = 0.58;
        structureState.zoom = structureHomeZoom;
        structureState.panX = 0;
        structureState.panY = 0;
        drawStructure();
      });

      structureModeControls.addEventListener("click", event => {
        const button = event.target.closest("button[data-mode]");
        if (!button) return;
        structureState.mode = button.dataset.mode;
        structureModeControls.querySelectorAll("button").forEach(item => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        drawStructure();
      });
    }

    function animateStructure() {
      if (!structureState.auto) return;
      structureState.rotY += 0.01;
      drawStructure();
      structureState.raf = requestAnimationFrame(animateStructure);
    }

    function sortedRows() {
      const copy = rows.slice();
      let comparator;
      if (activeSort === "stabilizing") {
        comparator = (a, b) => a.bestValue - b.bestValue || a.index - b.index;
      } else if (activeSort === "destabilizing") {
        comparator = (a, b) => b.worstValue - a.worstValue || a.index - b.index;
      } else if (activeSort === "mean") {
        comparator = (a, b) => b.mean - a.mean || a.index - b.index;
      } else {
        comparator = (a, b) => a.index - b.index;
      }
      copy.sort((a, b) => sortDirection * comparator(a, b));
      return copy;
    }

    function updateSortDirectionButton() {
      const isReverse = sortDirection === -1;
      sortDirectionButton.dataset.direction = isReverse ? "reverse" : "default";
      sortDirectionButton.setAttribute("aria-pressed", String(isReverse));
      sortDirectionButton.setAttribute("aria-label", isReverse ? "Use Default Row Ordering" : "Reverse Row Ordering");
      sortDirectionButton.title = isReverse ? "Use Default Row Ordering" : "Reverse Row Ordering";
    }

    function cellKey(row, aa) {
      return `${row.index}:${aa}`;
    }

    function heatmapRegionWeight(rowIndex) {
      if (!selectedResidueIndex) return 0;
      const distance = Math.abs(Number(rowIndex) - Number(selectedResidueIndex));
      if (distance === 0) return 2;
      return 0;
    }

    function scrollHeatmapRowIntoView(rowIndex, behavior = "smooth") {
      if (!heatmapScroll) return;
      const rowLabel = svg.querySelector(`.row-label[data-row="${rowIndex}"]`);
      if (!rowLabel) return;

      const rowRect = rowLabel.getBoundingClientRect();
      const scrollRect = heatmapScroll.getBoundingClientRect();
      const stickyHeight = stickyAxis ? stickyAxis.getBoundingClientRect().height : 0;
      const topPadding = Math.max(stickyHeight + 8, dims.cellH * 2);
      const bottomPadding = Math.max(24, dims.cellH * 2);

      if (rowRect.top >= scrollRect.top + topPadding && rowRect.bottom <= scrollRect.bottom - bottomPadding) return;

      const rowCenter = rowRect.top + rowRect.height / 2;
      const visibleHeight = Math.max(1, scrollRect.height - topPadding - bottomPadding);
      const scrollCenter = scrollRect.top + topPadding + visibleHeight / 2;
      const maxTop = Math.max(0, heatmapScroll.scrollHeight - heatmapScroll.clientHeight);
      const nextTop = clamp(heatmapScroll.scrollTop + rowCenter - scrollCenter, 0, maxTop);
      heatmapScroll.scrollTop = nextTop;
    }

    function scheduleHeatmapRowScroll(rowIndex, behavior = "smooth") {
      const run = () => scrollHeatmapRowIntoView(rowIndex, behavior);
      if (window.requestAnimationFrame) {
        window.requestAnimationFrame(run);
      } else {
        window.setTimeout(run, 0);
      }
    }

    function renderStickyAxis(width) {
      if (!stickyAxis) return;
      stickyAxis.innerHTML = "";

      function addLabel(text, x, className = "") {
        const label = document.createElement("span");
        label.textContent = text;
        label.style.left = `${(x / width) * 100}%`;
        if (className) label.className = className;
        stickyAxis.appendChild(label);
      }

      aaOrder.forEach((aa, col) => {
        const x = dims.left + col * (dims.cellW + dims.gap) + dims.cellW / 2;
        addLabel(aa, x);
      });

      const meanX = dims.left + aaOrder.length * (dims.cellW + dims.gap) + dims.summaryGap;
      addLabel("ΔΔG Mean", meanX, "axis-summary");
    }

    function mutationTarget(mutation) {
      const match = String(mutation || "").match(/^([A-Z])(\d+)([A-Z])$/);
      if (!match) return null;
      const row = getRowByIndex(Number(match[2]));
      if (!row) return null;
      const aa = match[3];
      if (!aaOrder.includes(aa)) return null;
      return { row, aa };
    }

    function renderSummary() {
      const items = [
        { value: meta.residueCount, label: "Protein Residues", cardClass: "compact" },
        { value: meta.mutationCount, label: "Possible Mutations", cardClass: "compact" },
        { value: meta.stabilizingCount, label: "Stabilizing", className: "stabilizing-label" },
        { value: meta.neutralCount, label: "Near-Neutral", className: "neutral-label" },
        { value: meta.destabilizingCount, label: "Destabilizing", className: "destabilizing-label" },
        {
          value: `${meta.strongestMutation} = ${formatValue(meta.strongestValue)} <small>kcal/mol</small>`,
          label: "Most Stabilizing",
          className: "stabilizing-label",
          cardClass: "effect",
          mutation: meta.strongestMutation
        },
        {
          value: `${meta.weakestMutation} = ${formatValue(meta.weakestValue)} <small>kcal/mol</small>`,
          label: "Most Destabilizing",
          className: "destabilizing-label",
          cardClass: "effect",
          mutation: meta.weakestMutation
        }
      ];
      summary.innerHTML = items.map(item => {
        const target = mutationTarget(item.mutation);
        const content = `<b>${item.value}</b><span class="${item.className || ""}">${item.label}</span>`;
        if (!target) {
          return `<div class="metric ${item.cardClass || ""}">${content}</div>`;
        }
        return `
          <button type="button" class="metric ${item.cardClass || ""}" data-row="${target.row.index}" data-aa="${target.aa}" aria-label="Select ${item.mutation}, ${item.label}">
            ${content}
          </button>
        `;
      }).join("");
      renderSequencePreview();
    }

    function drawHeatmap() {
      const displayRows = sortedRows();
      const width = dims.left + aaOrder.length * (dims.cellW + dims.gap) + dims.summaryGap + dims.summaryW + dims.right;
      const height = dims.top + displayRows.length * (dims.cellH + dims.gap) + dims.bottom;
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = "";
      renderStickyAxis(width);

      const ns = "http://www.w3.org/2000/svg";

      function add(tag, attrs, parent = svg) {
        const el = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attrs)) {
          el.setAttribute(key, value);
        }
        parent.appendChild(el);
        return el;
      }

      add("rect", { x: 0, y: 0, width, height, fill: "#f7faf7" });

      displayRows.forEach((row, rowIndex) => {
        const y = dims.top + rowIndex * (dims.cellH + dims.gap);
        const regionWeight = heatmapRegionWeight(row.index);
        const rowBandX = dims.left - dims.rowLabelGutter;
        const rowBandRight = dims.left
          + aaOrder.length * (dims.cellW + dims.gap)
          + dims.summaryGap
          + dims.summaryW
          + 6;
        if (regionWeight > 0) {
          add("rect", {
            x: rowBandX,
            y: y - 1,
            width: rowBandRight - rowBandX,
            height: dims.cellH + 2,
            rx: 5,
            class: regionWeight === 2 ? "heatmap-selected-band" : "heatmap-region-band"
          });
        }
        const rowLabel = `${row.index} ${row.wildType}`;
        add("text", {
          x: dims.left - 10,
          y: y + dims.cellH - 4,
          "text-anchor": "end",
          class: `row-label row-select-target${regionWeight === 2 ? " selected-row" : regionWeight === 1 ? " region-row" : ""}`,
          tabindex: 0,
          "data-row": row.index,
          "data-aa": row.wildType,
          "aria-label": `Select residue ${row.wildType}${row.index} in structure`
        }).textContent = rowLabel;

        aaOrder.forEach((aa, col) => {
          const x = dims.left + col * (dims.cellW + dims.gap);
          const value = row.values[aa];
          const isWt = aa === row.wildType;
          const isAvailable = isFiniteValue(value);
          const isSelected = selectedKey === cellKey(row, aa);
          const missingResidue = isMissingResidue(row);
          const valueLabel = isAvailable ? `${formatValue(value)} kcal/mol` : "missing residue / not predicted";
          const classText = classify(value, isWt);
          const rect = add("rect", {
            x,
            y,
            width: dims.cellW,
            height: dims.cellH,
            rx: 2,
            fill: colorFor(value),
            class: `cell${isWt ? " wt" : ""}${isAvailable ? "" : " unavailable"}${isSelected ? " selected" : ""}`,
            tabindex: 0,
            "data-row": row.index,
            "data-aa": aa,
            "aria-label": `${row.wildType}${row.index}${aa} ${valueLabel}`
          });
          add("title", {}, rect).textContent = missingResidue
            ? `${row.wildType}${row.index}${aa} · missing residue / not predicted`
            : `${row.wildType}${row.index}${aa} · ${valueLabel} · ${classText}`;
          if (isSelected) {
            const mark = add("g", {
              class: "selected-cell-mark",
              "aria-hidden": "true"
            });
            const lines = [
              [x + 4.8, y + 3.2, x + dims.cellW - 4.8, y + dims.cellH - 3.2],
              [x + dims.cellW - 4.8, y + 3.2, x + 4.8, y + dims.cellH - 3.2]
            ];
            lines.forEach(([x1, y1, x2, y2]) => {
              add("line", { x1, y1, x2, y2, class: "mark-shadow" }, mark);
            });
            lines.forEach(([x1, y1, x2, y2]) => {
              add("line", { x1, y1, x2, y2, class: "mark-core" }, mark);
            });
          }
        });

        const meanX = dims.left + aaOrder.length * (dims.cellW + dims.gap) + dims.summaryGap;
        const meanAvailable = isFiniteValue(row.mean);
        const meanColor = colorFor(row.mean);
        add("rect", {
          x: meanX,
          y,
          width: 52,
          height: dims.cellH,
          rx: 2,
          fill: meanColor,
          class: `row-summary-target${meanAvailable ? "" : " unavailable"}`,
          tabindex: 0,
          "data-row": row.index,
          "data-aa": row.wildType,
          "aria-label": meanAvailable ? `Select residue ${row.wildType}${row.index} from ΔΔG Mean` : `Residue ${row.wildType}${row.index} missing or not predicted`
        });
        add("text", {
          x: meanX + 26,
          y: y + dims.cellH - 4,
          "text-anchor": "middle",
          class: "summary-label",
          fill: "#ffffff",
          "pointer-events": "none"
        }).textContent = formatValue(row.mean);
      });

      svg.querySelectorAll(".cell").forEach(cell => {
        cell.addEventListener("pointerenter", () => {
          previewSequenceFromCell(cell.dataset.row, cell.dataset.aa);
          previewMutationInSelectedRow(cell.dataset.row, cell.dataset.aa);
        });
        cell.addEventListener("pointermove", () => {
          previewSequenceFromCell(cell.dataset.row, cell.dataset.aa);
          previewMutationInSelectedRow(cell.dataset.row, cell.dataset.aa);
        });
        cell.addEventListener("pointerleave", renderSequenceFromSelection);
        cell.addEventListener("click", () => updateSelection(cell.dataset.row, cell.dataset.aa, true));
      });
      svg.querySelectorAll(".row-select-target, .row-summary-target").forEach(target => {
        target.addEventListener("click", () => updateSelection(target.dataset.row, target.dataset.aa, true));
      });
    }

    function rankedMutations(type) {
      const allMutations = [];
      rows.forEach(row => {
        aaOrder.forEach(aa => {
          if (aa === row.wildType) return;
          allMutations.push({
            row,
            aa,
            mutation: `${row.wildType}${row.index}${aa}`,
            value: row.values[aa]
          });
        });
      });

      const direction = type === "destabilizing" ? -1 : 1;
      return allMutations
        .sort((a, b) => direction * (a.value - b.value) || a.row.index - b.row.index || a.aa.localeCompare(b.aa))
        .slice(0, 10);
    }

    function renderMutationList(type) {
      if (!mutationListOutput || !mutationListButtons) return;
      activeMutationList = type;
      mutationListButtons.querySelectorAll("button[data-list]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.list === type));
      });

      const title = type === "destabilizing" ? "Top 10 Most Destabilizing Mutations" : "Top 10 Most Stabilizing Mutations";
      const rowsHtml = rankedMutations(type).map((item, index) => {
        const width = Math.max(4, clamp(Math.abs(item.value) / colorScale, 0, 1) * 100);
        return `
          <li>
            <button type="button" data-row="${item.row.index}" data-aa="${item.aa}">
              <span class="mutation-rank">${index + 1}</span>
              <span class="mutation-name">${item.mutation}</span>
              <span class="mutation-bar"><span style="width: ${width}%; background: ${colorFor(item.value)}"></span></span>
              <span class="mutation-value">${formatValue(item.value)}</span>
            </button>
          </li>
        `;
      }).join("");

      mutationListOutput.hidden = false;
      mutationListOutput.innerHTML = `
        <div class="mutation-list-header">
          <b>${title}</b>
          <span>ΔΔG kcal/mol</span>
        </div>
        <ol class="mutation-results">${rowsHtml}</ol>
      `;
    }

    function updateSelection(rowIndex, aa, redraw) {
      const row = rows.find(item => String(item.index) === String(rowIndex));
      if (!row) return;

      const value = row.values[aa];
      selectedKey = cellKey(row, aa);
      renderSequencePreview(row, aa, { focusResidue: true, scrollToResidue: true });
      renderResidueLookup(row, aa);
      selectStructureResidue(row, aa, value, { focusView: redraw });

      if (redraw) {
        drawHeatmap();
        scheduleHeatmapRowScroll(row.index);
        return;
      }

      svg.querySelectorAll(".cell.selected").forEach(cell => cell.classList.remove("selected"));
      const active = svg.querySelector(`.cell[data-row="${row.index}"][data-aa="${aa}"]`);
      if (active) active.classList.add("selected");
    }

    function initializeDefaultSelection() {
      const firstRow = rows[0];
      if (!firstRow) {
        renderResidueLookup();
        renderSequencePreview();
        drawStructure();
        return;
      }
      updateSelection(firstRow.index, firstRow.wildType, false);
    }

    if (sidePanel) {
      restorePanelOrder();

      sidePanel.addEventListener("click", event => {
        const handle = event.target instanceof Element
          ? event.target.closest("[data-panel-handle]")
          : null;
        if (!handle || Date.now() - lastPanelDragAt < 300) return;
        swapSidePanels();
      });

      sidePanel.addEventListener("pointerdown", event => {
        const handle = event.target instanceof Element
          ? event.target.closest("[data-panel-handle]")
          : null;
        if (!handle) return;
        if (event.button !== undefined && event.button !== 0) return;
        const panel = handle.closest(".panel-section[data-panel]");
        if (!panel) return;

        pointerPanelDrag = {
          panelKey: panel.dataset.panel,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          active: false
        };
        if (handle.setPointerCapture) {
          try {
            handle.setPointerCapture(event.pointerId);
          } catch (_) {}
        }
      });

      sidePanel.addEventListener("pointermove", event => {
        if (!pointerPanelDrag || pointerPanelDrag.pointerId !== event.pointerId) return;
        const distance = Math.hypot(
          event.clientX - pointerPanelDrag.startX,
          event.clientY - pointerPanelDrag.startY
        );
        if (!pointerPanelDrag.active && distance < 6) return;

        if (!pointerPanelDrag.active) {
          pointerPanelDrag.active = true;
          draggedPanelKey = pointerPanelDrag.panelKey;
          const panel = panelByKey(draggedPanelKey);
          if (panel) panel.classList.add("dragging");
        }
        updatePanelDropCue(event.clientX, event.clientY);
        event.preventDefault();
      });

      const finishPanelPointerDrag = (event, cancelled = false) => {
        if (!pointerPanelDrag || pointerPanelDrag.pointerId !== event.pointerId) return;
        if (!pointerPanelDrag.active) {
          pointerPanelDrag = null;
          return;
        }

        const sourceKey = pointerPanelDrag.panelKey;
        const targetPanel = cancelled ? null : updatePanelDropCue(event.clientX, event.clientY);
        if (targetPanel && targetPanel.dataset.panel !== sourceKey) {
          swapSidePanels();
        }
        clearPanelDragState(true);
        event.preventDefault();
      };

      sidePanel.addEventListener("pointerup", event => finishPanelPointerDrag(event));
      sidePanel.addEventListener("pointercancel", event => finishPanelPointerDrag(event, true));
    }

    sortControls.addEventListener("click", event => {
      const button = event.target.closest("button[data-sort]");
      if (!button) return;
      activeSort = button.dataset.sort;
      sortControls.querySelectorAll("button").forEach(item => {
        item.setAttribute("aria-pressed", String(item === button));
      });
      drawHeatmap();
      if (heatmapScroll) heatmapScroll.scrollTop = 0;
    });

    sortDirectionButton.addEventListener("click", () => {
      sortDirection *= -1;
      updateSortDirectionButton();
      drawHeatmap();
      if (heatmapScroll) heatmapScroll.scrollTop = 0;
    });

    scaleRange.addEventListener("input", () => {
      colorScale = effectiveColorScaleFromSlider(scaleRange.value);
      updateScaleReadout(colorScale);
      drawHeatmap();
      if (activeMutationList) renderMutationList(activeMutationList);
    });

    scaleResetButton.addEventListener("click", () => {
      if (defaultColorScaleSliderValue === null) return;
      scaleRange.value = String(defaultColorScaleSliderValue);
      colorScale = effectiveColorScaleFromSlider(scaleRange.value);
      updateScaleReadout(colorScale);
      drawHeatmap();
      if (activeMutationList) renderMutationList(activeMutationList);
    });

    mutationListButtons.addEventListener("click", event => {
      const button = event.target.closest("button[data-list]");
      if (!button) return;
      renderMutationList(button.dataset.list);
    });

    mutationListOutput.addEventListener("click", event => {
      const button = event.target.closest("button[data-row][data-aa]");
      if (!button) return;
      updateSelection(button.dataset.row, button.dataset.aa, true);
    });

    summary.addEventListener("click", event => {
      const button = event.target.closest("button[data-row][data-aa]");
      if (!button) return;
      updateSelection(button.dataset.row, button.dataset.aa, true);
    });

    sequenceText.addEventListener("click", event => {
      const target = event.target instanceof Element
        ? event.target.closest(".sequence-residue[data-row][data-aa]")
        : null;
      if (!target) return;
      updateSelection(target.dataset.row, target.dataset.aa, true);
    });

    function selectResidueFromLookup(rowIndex) {
      const numericIndex = Number(rowIndex);
      if (!Number.isInteger(numericIndex)) return;
      const row = getRowByIndex(numericIndex);
      if (!row) return;
      updateSelection(row.index, row.wildType, true);
    }

    residueLookupInput.addEventListener("input", () => {
      selectResidueFromLookup(residueLookupInput.value);
    });

    prevResidueButton.addEventListener("click", () => {
      const current = Number(residueLookupInput.value || selectedResidueIndex || 1);
      selectResidueFromLookup(Math.max(1, current - 1));
    });

    nextResidueButton.addEventListener("click", () => {
      const maxResidue = Number(meta.residueCount || rows.length);
      const current = Number(residueLookupInput.value || selectedResidueIndex || 0);
      selectResidueFromLookup(Math.min(maxResidue, current + 1));
    });

    mutationLookupTable.addEventListener("click", event => {
      const button = event.target.closest("button[data-row][data-aa]");
      if (!button) return;
      updateSelection(button.dataset.row, button.dataset.aa, true);
    });

    document.addEventListener("pointermove", event => {
      const target = event.target instanceof Element ? event.target : null;
      if (target && target.closest("#heatmap .cell")) return;
      renderSequenceFromSelection();
    });

    document.addEventListener("pointerdown", event => {
      const target = event.target instanceof Element ? event.target : null;
      if (target && heatmapShell && target.closest(".heatmap-shell")) return;
      if (target && target.closest(".structure-panel")) return;
      if (target && target.closest(".side-panel")) return;
      if (target && target.closest(".lookup-rail")) return;
      if (target && target.closest(".mutation-lists")) return;
      if (!selectedKey && !selectedResidueIndex) return;
      clearSelection(true);
    });

    renderSummary();
    setupStructureViewer();
    drawHeatmap();
    initializeDefaultSelection();
  </script>
</body>
</html>
