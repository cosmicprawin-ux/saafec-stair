<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>2L33_A Mutation ΔΔG Stability Predictions</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #5f6d64;
      --line: #d8ded8;
      --panel: #f8faf7;
      --paper: #ffffff;
      --green: #159447;
      --green-dark: #0e6f34;
      --neutral: #fff8e8;
      --red: #c4322b;
      --red-dark: #8f211d;
      --accent: #245b73;
      --shadow: 0 12px 32px rgba(31, 41, 35, 0.10);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #edf2ed;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(500px, 1.35fr) minmax(0, 2fr);
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .title-block {
      display: grid;
      gap: 7px;
      align-content: center;
      min-width: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .convention {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      max-width: none;
    }

    .convention-item {
      display: grid;
      align-content: center;
      gap: 2px;
      min-width: 0;
      min-height: 34px;
      padding: 5px 7px 5px 8px;
      border-left: 3px solid var(--line);
      border-radius: 7px;
      background: #f8faf7;
    }

    .convention-item b {
      font-size: 11.5px;
      line-height: 1;
    }

    .convention-item em {
      min-width: 0;
      color: var(--muted);
      font-style: normal;
      font-size: 10px;
      line-height: 1.08;
      white-space: nowrap;
    }

    .convention-stabilizing {
      border-left-color: var(--green);
    }

    .convention-stabilizing b {
      color: var(--green-dark);
    }

    .convention-neutral {
      border-left-color: #d7c26a;
    }

    .convention-neutral b {
      color: #73613a;
    }

    .convention-destabilizing {
      border-left-color: var(--red);
    }

    .convention-destabilizing b {
      color: var(--red-dark);
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(66px, 0.66fr) minmax(92px, 0.82fr) repeat(3, minmax(82px, 0.82fr)) repeat(2, minmax(128px, 1.2fr));
      gap: 6px;
      align-self: stretch;
    }

    .metric {
      display: grid;
      align-content: center;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 6px 8px;
      min-width: 0;
    }

    button.metric {
      width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    button.metric:hover,
    button.metric:focus-visible {
      border-color: rgba(36, 91, 115, 0.44);
      background: #f6faf7;
      outline: 0;
      box-shadow: 0 0 0 2px rgba(36, 91, 115, 0.12);
    }

    .metric b {
      display: block;
      font-size: 16px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric b small {
      margin-left: 3px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0;
      vertical-align: baseline;
    }

    .metric.compact {
      padding-left: 8px;
      padding-right: 8px;
    }

    .metric.effect b {
      font-size: clamp(13px, 0.9vw, 17px);
      overflow: visible;
      text-overflow: clip;
    }

    .metric.effect b small {
      margin-left: 2px;
      font-size: 9.5px;
      font-weight: 800;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.15;
    }

    .metric span.stabilizing-label {
      color: var(--green-dark);
      font-weight: 750;
    }

    .metric span.destabilizing-label {
      color: var(--red-dark);
      font-weight: 750;
    }

    .metric span.neutral-label {
      color: #73613a;
      font-weight: 750;
    }

    .metric.effect span.stabilizing-label,
    .metric.effect span.destabilizing-label,
    .metric.effect span.neutral-label {
      font-weight: 800;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 3.2fr) minmax(0, 1.8fr) minmax(200px, 1fr);
      gap: 8px;
      padding: 14px 14px 18px;
      min-height: 0;
      align-items: start;
    }

    .heatmap-column {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .analysis-rail {
      display: grid;
      grid-template-rows: minmax(330px, 2fr) minmax(180px, 1fr);
      gap: 8px;
      height: clamp(560px, calc(100vh - 130px), 900px);
      min-width: 0;
      min-height: 0;
    }

    .heatmap-shell,
    .mutation-lists,
    .structure-panel,
    .lookup-rail,
    .side-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .heatmap-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      height: clamp(500px, calc(100vh - 130px), 900px);
      overflow: hidden;
    }

    .structure-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      min-height: 0;
    }

    .structure-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 54px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .viewer-actions {
      grid-column: 3;
      display: inline-flex;
      gap: 6px;
      justify-self: end;
    }

    .viewer-actions button {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .viewer-actions button[aria-pressed="true"] {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .structure-toolbar {
      grid-column: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      justify-self: start;
      padding: 0;
      border-bottom: 0;
      background: transparent;
    }

    .structure-canvas-wrap {
      background: #f5f8f5;
      height: auto;
      min-height: 0;
      overflow: hidden;
    }

    #structureCanvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      cursor: grab;
      touch-action: none;
    }

    #structureCanvas:active {
      cursor: grabbing;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .control-group {
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      flex-wrap: nowrap;
      gap: 6px;
      min-width: 0;
    }

    .control-group label {
      font-size: 11px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .segmented {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(72px, auto));
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef3ee;
    }

    .segmented button,
    .icon-button {
      border: 0;
      color: var(--ink);
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    .segmented button {
      min-height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--paper);
      box-shadow: 0 1px 4px rgba(28, 39, 31, 0.12);
    }

    .segmented.row-sort {
      grid-template-columns: repeat(2, minmax(54px, auto));
    }

    .segmented.row-sort button {
      min-height: 28px;
      padding: 0 6px;
      font-size: 10.5px;
      line-height: 1.05;
      white-space: normal;
    }

    .sort-direction-button {
      width: 28px;
      min-width: 28px;
      min-height: 30px;
      border: 1px solid var(--line);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: #eef3ee;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    }

    .sort-direction-button:hover {
      background: #f7faf7;
    }

    .sort-direction-button .sort-arrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 0.86;
    }

    .sort-direction-button[data-direction="default"] .sort-arrow-up,
    .sort-direction-button[data-direction="reverse"] .sort-arrow-down {
      color: var(--accent);
    }

    .segmented.structure-mode {
      grid-template-columns: repeat(3, minmax(58px, auto));
    }

    .segmented.structure-mode button {
      min-height: 30px;
      padding: 0 7px;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 5px;
      margin-left: clamp(22px, 3vw, 26px);
    }

    input[type="range"] {
      width: 58px;
      accent-color: var(--accent);
    }

    .scale-reset-button {
      width: 22px;
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: #eef3ee;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.42);
    }

    .scale-reset-button:hover,
    .scale-reset-button:focus-visible {
      background: #f7faf7;
      outline: 0;
      box-shadow: 0 0 0 2px rgba(36, 91, 115, 0.12);
    }

    .scale-reset-button:disabled {
      cursor: default;
      opacity: 0.38;
      color: var(--muted);
      box-shadow: none;
    }

    .scale-value {
      display: none;
    }

    .legend {
      display: grid;
      grid-template-columns: auto minmax(70px, 92px) auto;
      flex: 0 1 210px;
      gap: 5px;
      align-items: center;
      color: var(--muted);
      font-size: 10.5px;
      min-width: 198px;
    }

    .ramp {
      height: 10px;
      border: 1px solid #cbd2cc;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--green-dark), var(--green), var(--neutral) 50%, #f08d77, var(--red-dark));
    }

    .heatmap-scroll {
      overflow: auto;
      position: relative;
      min-height: 0;
      background: #f4f7f3;
      scrollbar-gutter: stable;
    }

    .heatmap-sticky-axis {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 45px;
      margin-bottom: -45px;
      border-bottom: 1px solid rgba(202, 213, 204, 0.92);
      background: rgba(247, 250, 247, 0.96);
      box-shadow: 0 4px 10px rgba(28, 39, 31, 0.06);
      font-family: inherit;
      pointer-events: none;
    }

    .heatmap-sticky-axis span {
      position: absolute;
      top: 27px;
      color: #304038;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .heatmap-sticky-axis .axis-summary {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      transform: translateY(-50%);
    }

    #heatmap {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto;
      font-family: inherit;
    }

    .axis-label {
      fill: #304038;
      font-size: 12px;
      font-weight: 700;
    }

    .row-label {
      fill: #33433a;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }

    .row-label.region-row {
      fill: #245b73;
      font-weight: 800;
    }

    .row-label.selected-row {
      fill: #17211b;
      font-weight: 900;
    }

    .summary-label {
      fill: #ffffff;
      font-size: 10px;
      font-weight: 750;
      paint-order: stroke fill;
      stroke: rgba(23, 33, 27, 0.38);
      stroke-width: 0.45px;
    }

    .row-summary-target {
      cursor: pointer;
    }

    .row-summary-target.unavailable {
      cursor: pointer;
      stroke: rgba(255, 255, 255, 0.72);
      stroke-width: 1.2;
    }

    .cell {
      stroke: rgba(255, 255, 255, 0.62);
      stroke-width: 1;
      shape-rendering: crispEdges;
      cursor: crosshair;
    }

    .cell:focus {
      outline: none;
    }

    .cell.selected {
      stroke: #101813;
      stroke-width: 3.8;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .cell.unavailable {
      cursor: pointer;
      stroke: rgba(255, 255, 255, 0.72);
      stroke-width: 1.2;
    }

    .cell.wt {
      stroke: #1d2b24;
      stroke-width: 1.6;
    }

    .cell.wt.selected {
      stroke: #101813;
      stroke-width: 3.8;
    }

    .selected-cell-mark {
      pointer-events: none;
    }

    .selected-cell-mark .mark-shadow {
      stroke: #101813;
      stroke-width: 3.8;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .selected-cell-mark .mark-core {
      stroke: #ffffff;
      stroke-width: 1.7;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .row-guide {
      fill: rgba(36, 91, 115, 0.08);
      pointer-events: none;
    }

    .heatmap-region-band {
      fill: rgba(36, 91, 115, 0.08);
      pointer-events: none;
    }

    .heatmap-selected-band {
      fill: rgba(117, 76, 177, 0.28);
      stroke: rgba(70, 38, 136, 0.86);
      stroke-width: 1.8;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .summary-bar-bg {
      fill: #edf2ed;
    }

    .side-panel {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      height: auto;
      overflow: hidden;
      min-height: 0;
    }

    .side-panel[data-order="sequence-first"] {
      grid-template-rows: clamp(178px, 19vh, 230px) minmax(280px, 1fr);
    }

    .side-panel[data-order="lookup-first"] {
      grid-template-rows: minmax(280px, 1fr) clamp(178px, 19vh, 230px);
    }

    .panel-section {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      min-height: 0;
    }

    .panel-section:last-child {
      border-bottom: 0;
    }

    .sequence-section {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 3px;
      min-height: 0;
      padding: 9px 11px 10px;
    }

    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .residue-title-row {
      flex: 1 1 auto;
      justify-content: flex-start;
    }

    .panel-drag-handle {
      width: 24px;
      min-width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #eef3ee;
      cursor: grab;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      line-height: 1;
    }

    .panel-drag-handle:hover,
    .panel-drag-handle:focus-visible {
      color: var(--accent);
      background: #f7faf7;
      outline: 0;
      box-shadow: 0 0 0 2px rgba(36, 91, 115, 0.12);
    }

    .panel-drag-handle:active {
      cursor: grabbing;
    }

    .panel-section.dragging {
      opacity: 0.62;
    }

    .panel-section.drag-over {
      background: #f7f4fb;
      box-shadow: inset 0 0 0 2px rgba(70, 38, 136, 0.45);
    }

    .mutation-detail-section {
      overflow: hidden;
    }

    .lookup-rail {
      display: grid;
      height: clamp(560px, calc(100vh - 130px), 900px);
      overflow: hidden;
      min-height: 0;
    }

    .lookup-rail .mutation-detail-section {
      border-bottom: 0;
      padding: 12px;
    }

    .detail-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
    }

    .residue-panel {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 5px;
      height: 100%;
      min-height: 0;
    }

    .residue-lookup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .residue-lookup-head .detail-title {
      white-space: nowrap;
    }

    .lookup-rail .residue-lookup-head {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
    }

    .lookup-rail .residue-title-row {
      display: none;
    }

    .residue-controls {
      display: grid;
      grid-template-columns: 30px minmax(86px, 1fr) 30px;
      align-items: center;
      gap: 6px;
      width: min(210px, 100%);
    }

    .lookup-rail .residue-controls {
      grid-template-columns: 24px minmax(46px, 1fr) 24px;
      gap: 3px;
      width: 100%;
    }

    .residue-step,
    .residue-input {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      font: inherit;
    }

    .residue-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      font-weight: 850;
      line-height: 1;
    }

    .residue-step:hover {
      background: #eef3ee;
    }

    .residue-input {
      width: 100%;
      padding: 0 6px;
      font-size: 13px;
      font-weight: 750;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .residue-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .lookup-rail .residue-summary {
      grid-template-columns: 1fr;
      align-self: stretch;
      gap: 0;
    }

    .residue-summary div {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: var(--panel);
    }

    .lookup-rail .residue-summary div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 30px;
      padding: 4px 6px;
    }

    .residue-summary b {
      display: block;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .lookup-rail .residue-summary b {
      flex: 0 0 auto;
      font-size: 13px;
    }

    .residue-summary span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.15;
    }

    .lookup-rail .residue-summary span {
      min-width: 0;
      margin-top: 0;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9.5px;
    }

    .mutation-lookup-empty {
      display: grid;
      place-items: center;
      min-height: 140px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      background: var(--panel);
    }

    .missing-residue-alert {
      border: 1px solid #111827;
      background: #111827;
      color: #ffffff;
      padding: 14px;
      font-size: 13px;
      font-weight: 760;
      line-height: 1.45;
    }

    .missing-residue-alert b {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 900;
    }

    .missing-residue-alert span {
      display: block;
      color: #d8dee6;
      font-weight: 650;
    }

    .mutation-lookup-table {
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .lookup-rail .mutation-lookup-table {
      display: grid;
      overflow: hidden;
    }

    .mutation-lookup-groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-width: 0;
    }

    .lookup-rail .mutation-lookup-groups {
      grid-template-columns: 1fr;
      height: 100%;
      min-height: 0;
    }

    .mutation-lookup-group {
      min-width: 0;
      border-right: 1px solid #e1e8e1;
    }

    .lookup-rail .mutation-lookup-group {
      display: grid;
      grid-template-rows: auto repeat(20, minmax(23px, 1fr));
      min-height: 0;
    }

    .mutation-lookup-group:last-child {
      border-right: 0;
    }

    .mutation-lookup-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(38px, 0.52fr) minmax(40px, 0.56fr) minmax(84px, 1.42fr);
      gap: 9px;
      padding: 3px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: #f4f8f4;
      font-size: clamp(9px, 1.25vh, 10.4px);
      font-weight: 850;
      text-transform: uppercase;
    }

    .mutation-lookup-heading span {
      justify-self: start;
      text-align: left;
    }

    .mutation-lookup-heading span:nth-child(2) {
      justify-self: end;
      text-align: right;
    }

    .mutation-lookup-heading span:nth-child(3) {
      margin-left: 2px;
    }

    .mutation-lookup-row {
      display: grid;
      grid-template-columns: minmax(38px, 0.52fr) minmax(40px, 0.56fr) minmax(84px, 1.42fr);
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 23px;
      padding: 1px 4px;
      border: 0;
      border-bottom: 1px solid #e7ece7;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: clamp(11.4px, 1.55vh, 13px);
      text-align: left;
      cursor: pointer;
    }

    .mutation-lookup-row:last-child {
      border-bottom: 0;
    }

    .mutation-lookup-row:hover,
    .mutation-lookup-row.selected {
      background: #eef5f0;
    }

    .mutation-lookup-row.selected {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .mutation-lookup-row.unavailable {
      color: var(--muted);
      cursor: default;
      background: #f7faf7;
    }

    .mutation-lookup-row.unavailable:hover {
      background: #f7faf7;
    }

    .mutation-lookup-row.unavailable .mutation-state-cell::before {
      background: #b9c2ba;
    }

    .mutation-name-cell {
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mutation-value-cell {
      justify-self: end;
      text-align: right;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .mutation-state-cell {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      margin-left: 2px;
      color: var(--muted);
      overflow: hidden;
      font-size: clamp(10.5px, 1.42vh, 12px);
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mutation-state-cell::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 999px;
      background: #d7c26a;
      flex: 0 0 auto;
    }

    .mutation-lookup-row.stabilizing .mutation-state-cell {
      color: var(--green-dark);
    }

    .mutation-lookup-row.stabilizing .mutation-state-cell::before {
      background: var(--green);
    }

    .mutation-lookup-row.destabilizing .mutation-state-cell {
      color: var(--red-dark);
    }

    .mutation-lookup-row.destabilizing .mutation-state-cell::before {
      background: var(--red);
    }

    .mutation-lookup-row.wild-type .mutation-state-cell {
      color: var(--accent);
    }

    .mutation-lookup-row.wild-type .mutation-state-cell::before {
      background: var(--accent);
    }

    .sequence {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: flex-start;
      gap: 0 1px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      line-height: 1.15;
      color: #26362e;
      height: 100%;
      max-height: none;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .sequence-residue {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.05ch;
      height: 15px;
      border-radius: 3px;
      color: #26362e;
    }

    .sequence-residue[data-row] {
      cursor: pointer;
    }

    .sequence-residue[data-row]:hover {
      color: var(--ink);
      background: rgba(36, 91, 115, 0.13);
      box-shadow: inset 0 0 0 1px rgba(36, 91, 115, 0.42);
      font-weight: 850;
    }

    .sequence-residue.focused {
      color: var(--ink);
      background: rgba(36, 91, 115, 0.10);
      box-shadow: inset 0 0 0 1px rgba(36, 91, 115, 0.38);
      font-weight: 850;
    }

    .sequence-residue.mutant {
      color: #ffffff;
      background: #176d83;
      box-shadow: 0 0 0 1px rgba(23, 109, 131, 0.24), 0 1px 4px rgba(23, 109, 131, 0.24);
      font-weight: 900;
    }

    .sequence-residue.mutant:hover {
      color: #ffffff;
      background: #145f73;
    }

    .mutation-lists {
      padding: 10px;
      background: var(--paper);
    }

    .mutation-list-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mutation-list-actions button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .mutation-list-actions button[aria-pressed="true"][data-list="stabilizing"] {
      border-color: rgba(14, 111, 52, 0.45);
      color: var(--green-dark);
      background: rgba(21, 148, 71, 0.08);
    }

    .mutation-list-actions button[aria-pressed="true"][data-list="destabilizing"] {
      border-color: rgba(143, 33, 29, 0.45);
      color: var(--red-dark);
      background: rgba(196, 50, 43, 0.08);
    }

    .mutation-list-output[hidden] {
      display: none;
    }

    .mutation-list-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .mutation-list-header b {
      color: var(--ink);
      font-size: 13px;
    }

    .mutation-results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(30px, auto));
      grid-auto-flow: column;
      gap: 6px 8px;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .mutation-results button {
      display: grid;
      grid-template-columns: 24px 70px minmax(42px, 1fr) 70px;
      gap: 7px;
      align-items: center;
      width: 100%;
      min-height: 30px;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #203027;
      background: var(--panel);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }

    .mutation-rank {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .mutation-name {
      font-weight: 800;
    }

    .mutation-bar {
      height: 8px;
      border-radius: 999px;
      background: #e5ebe5;
      overflow: hidden;
    }

    .mutation-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
    }

    .mutation-value {
      justify-self: end;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .mobile-note {
      display: none;
    }

    @media (max-width: 1240px) {
      .topbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1020px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .heatmap-shell {
        height: clamp(430px, 68vh, 760px);
      }

      .analysis-rail {
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.8fr);
        grid-template-rows: minmax(0, 1fr);
        height: clamp(430px, 68vh, 760px);
      }

      .structure-canvas-wrap {
        height: auto;
      }

      .side-panel {
        height: auto;
      }

      .lookup-rail {
        height: clamp(360px, 52vh, 620px);
      }

      .side-panel[data-order="sequence-first"] {
        grid-template-rows: 135px minmax(320px, 1fr);
      }

      .side-panel[data-order="lookup-first"] {
        grid-template-rows: minmax(320px, 1fr) 135px;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 14px 12px 12px;
      }

      h1 {
        font-size: 19px;
      }

      .convention {
        grid-template-columns: 1fr;
        max-width: none;
      }

      .convention-item {
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        min-height: 30px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .workspace {
        padding: 10px;
      }

      .analysis-rail {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }

      .structure-panel {
        min-height: 340px;
      }

      #structureCanvas {
        height: clamp(280px, 72vw, 400px);
      }

      .side-panel {
        grid-template-rows: auto auto;
        height: auto;
      }

      .lookup-rail {
        height: auto;
      }

      .lookup-rail .mutation-detail-section {
        min-height: 380px;
      }

      .side-panel[data-order] {
        grid-template-rows: auto auto;
      }

      .mutation-lookup-groups {
        grid-template-columns: 1fr;
      }

      .mutation-lookup-group {
        border-right: 0;
        border-bottom: 1px solid #e1e8e1;
      }

      .mutation-lookup-group:last-child {
        border-bottom: 0;
      }

      .sequence {
        max-height: clamp(132px, 32vh, 280px);
      }

      .structure-header {
        grid-template-columns: 1fr;
        justify-items: start;
      }

      .structure-toolbar {
        grid-column: 1;
        grid-row: 2;
        justify-content: flex-start;
      }

      .viewer-actions {
        grid-column: 1;
        grid-row: 3;
        justify-self: start;
      }

      .controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .control-group {
        flex-wrap: wrap;
        width: 100%;
      }

      .slider-wrap {
        margin-left: 0;
      }

      .legend {
        width: 100%;
        grid-template-columns: auto 1fr auto;
      }

      .segmented {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .segmented.row-sort {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mutation-list-actions,
      .mutation-results {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-auto-flow: row;
      }

      .segmented button {
        padding: 0 6px;
      }

      input[type="range"] {
        width: 150px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar" aria-label="Protein stability matrix summary">
      <div class="title-block">
        <h1>2L33_A Mutation ΔΔG Stability Predictions</h1>
        <div class="subtitle convention" aria-label="Stability convention">
          <span class="convention-item convention-stabilizing"><b>Stabilizing</b><em>ΔΔG ≤ -0.5 kcal/mol</em></span>
          <span class="convention-item convention-neutral"><b>Near-Neutral</b><em>|ΔΔG| &lt; 0.5 kcal/mol</em></span>
          <span class="convention-item convention-destabilizing"><b>Destabilizing</b><em>ΔΔG ≥ +0.5 kcal/mol</em></span>
        </div>
      </div>
      <div class="summary" id="summary"></div>
    </section>

    <section class="workspace">
      <div class="heatmap-column">
        <section class="heatmap-shell" aria-label="All-mutant stability heatmap">
          <div class="controls">
            <div class="control-group">
              <label>Row Sorting</label>
              <div class="segmented row-sort" id="sortControls" aria-label="Row ordering">
                <button type="button" data-sort="sequence" aria-pressed="true">Sequence</button>
                <button type="button" data-sort="mean" aria-pressed="false">Mean</button>
              </div>
              <button class="icon-button sort-direction-button" id="sortDirectionButton" type="button" aria-pressed="false" aria-label="Reverse Row Ordering" title="Reverse Row Ordering" data-direction="default">
                <span class="sort-arrow sort-arrow-up" aria-hidden="true">↑</span>
                <span class="sort-arrow sort-arrow-down" aria-hidden="true">↓</span>
              </button>
              <div class="slider-wrap">
                <label for="scaleRange">Color Scaling</label>
                <input id="scaleRange" type="range" min="0.1" max="1" value="1" step="0.1">
                <button class="icon-button scale-reset-button" id="scaleResetButton" type="button" aria-label="Reset Color Scaling to Middle" title="Reset Color Scaling to Middle">↺</button>
                <b id="scaleValue" class="scale-value">auto</b>
              </div>
            </div>
            <div class="legend" aria-label="Color scale">
              <span>Stabilizing</span>
              <span class="ramp"></span>
              <span>Destabilizing</span>
            </div>
          </div>
          <div class="heatmap-scroll" id="heatmapScroll">
            <div class="heatmap-sticky-axis" id="heatmapStickyAxis" aria-hidden="true"></div>
            <svg id="heatmap" role="img" aria-label="Heatmap of predicted mutation stability effects"></svg>
          </div>
        </section>

        <section class="mutation-lists" aria-label="Top mutation lists">
          <div class="mutation-list-actions" id="mutationListButtons">
            <button type="button" data-list="stabilizing" aria-pressed="false">Most Stabilizing Mutations</button>
            <button type="button" data-list="destabilizing" aria-pressed="false">Most Destabilizing Mutations</button>
          </div>
          <div class="mutation-list-output" id="mutationListOutput" hidden></div>
        </section>
      </div>

      <section class="analysis-rail">
        <section class="structure-panel" aria-label="Embedded PDB structure viewer">
          <div class="structure-header">
            <div class="structure-toolbar">
              <label>Mode</label>
              <div class="segmented structure-mode" id="structureModeControls" aria-label="Structure display mode">
                <button type="button" data-mode="ribbon" aria-pressed="true">Ribbon</button>
                <button type="button" data-mode="atoms" aria-pressed="false">Atoms</button>
                <button type="button" data-mode="both" aria-pressed="false">Both</button>
              </div>
            </div>
            <div class="viewer-actions">
              <button type="button" id="spinButton" aria-pressed="false">Auto</button>
              <button type="button" id="resetViewButton">Reset</button>
            </div>
          </div>
          <div class="structure-canvas-wrap">
            <canvas id="structureCanvas" aria-label="Rotatable 3D protein structure with selected residue highlight"></canvas>
          </div>
        </section>

        <aside class="side-panel" id="sidePanel" aria-label="Sequence details">
          <section class="panel-section sequence-section" data-panel="sequence">
            <div class="panel-title-row">
              <p class="detail-title" id="sequenceTitle">Wild-Type Sequence</p>
            </div>
            <p class="sequence" id="sequenceText"></p>
          </section>
        </aside>
      </section>

      <aside class="lookup-rail" id="lookupRail" aria-label="Residue lookup">
        <section class="panel-section mutation-detail-section" data-panel="lookup">
          <div class="residue-panel">
            <div class="residue-lookup-head">
              <div class="panel-title-row residue-title-row">
                <p class="detail-title">Residue Lookup</p>
              </div>
              <div class="residue-controls" aria-label="Residue lookup controls">
                <button class="residue-step" type="button" id="prevResidueButton" aria-label="Previous Residue">‹</button>
                <input class="residue-input" id="residueLookupInput" type="number" min="1" step="1" inputmode="numeric" aria-label="Residue Number" placeholder="Residue">
                <button class="residue-step" type="button" id="nextResidueButton" aria-label="Next Residue">›</button>
              </div>
            </div>
            <div class="residue-summary" id="residueSummary" aria-live="polite"></div>
            <div class="mutation-lookup-table" id="mutationLookupTable" aria-live="polite">
              <div class="mutation-lookup-empty">Enter a residue number or select a residue.</div>
            </div>
          </div>
        </section>
      </aside>
    </section>
  </main>

    function scaleStepFor(value) {
      const safe = Math.max(Math.abs(Number(value) || 0), 0.1);
      if (safe <= 0.5) return 0.05;
      if (safe <= 1) return 0.1;
      if (safe <= 2) return 0.2;
      if (safe <= 5) return 0.5;
      if (safe <= 10) return 1;
      if (safe <= 20) return 2;
      if (safe <= 50) return 5;
      const power = Math.pow(10, Math.floor(Math.log10(safe)) - 1);
      return Math.max(1, power * 5);
    }

    function niceCeilScale(value) {
      const step = scaleStepFor(value);
      return Math.max(step, Math.ceil((Number(value) || step) / step) * step);
    }

    function formatScaleTick(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return "1";
      if (Math.abs(numeric) >= 10) return numeric.toFixed(numeric % 1 ? 1 : 0);
      if (Math.abs(numeric) >= 1) return numeric.toFixed(numeric % 1 ? 1 : 0);
      return numeric.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function initializeScaleControl() {
      const observedMax = Math.max(Math.abs(meta.minValue || 0), Math.abs(meta.maxValue || 0), 0.1);
      const autoScale = niceCeilScale(observedMax);
      const step = scaleStepFor(autoScale);
      scaleRange.min = String(step);
      scaleRange.max = String(autoScale);
      scaleRange.step = "any";
      const defaultScalePosition = step + ((autoScale - step) / 2);
      defaultColorScaleSliderValue = defaultScalePosition;
      scaleRange.value = String(defaultScalePosition);
      scaleRange.title = `Observed ΔΔG range: ${formatValue(meta.minValue)} to ${formatValue(meta.maxValue)} kcal/mol`;
      scaleValue.title = scaleRange.title;
      const effectiveScale = effectiveColorScaleFromSlider(scaleRange.value);
      updateScaleReadout(effectiveScale);
      return effectiveScale;
    }

    function effectiveColorScaleFromSlider(value) {
      const sliderValue = Number(value);
      const low = Number(scaleRange.min) || 0.1;
      const high = Math.max(low, Number(scaleRange.max) || low);
      return clamp(high + low - sliderValue, low, high);
    }

    function updateScaleReadout(nextColorScale = colorScale) {
      const sliderValue = Number(scaleRange.value);
      const sliderMin = Number(scaleRange.min);
      const sliderMax = Number(scaleRange.max);
      const atDefault = defaultColorScaleSliderValue !== null
        && Math.abs(sliderValue - defaultColorScaleSliderValue) < 1e-9;
      scaleValue.textContent = atDefault
        ? "mid"
        : sliderValue >= sliderMax
          ? "max"
          : sliderValue <= sliderMin
            ? "min"
            : `±${formatScaleTick(nextColorScale)}`;
      if (scaleResetButton) {
        scaleResetButton.disabled = atDefault;
      }
    }

    function panelSections() {
      if (!sidePanel) return [];
      return Array.from(sidePanel.querySelectorAll(".panel-section[data-panel]"));

    function panelByKey(key) {
      return sidePanel ? sidePanel.querySelector(`.panel-section[data-panel="${key}"]`) : null;
    }

    function currentPanelOrder() {
      return panelSections().map(panel => panel.dataset.panel);

    function applyPanelOrder(order, persist = true) {
      if (!sidePanel || !Array.isArray(order) || order.length !== 2) return;
      const normalized = order.filter(key => key === "sequence" || key === "lookup");
      if (normalized.length !== 2 || new Set(normalized).size !== 2) return;
      const panels = normalized.map(panelByKey);
      if (panels.some(panel => !panel)) return;

      panels.forEach(panel => sidePanel.appendChild(panel));
      sidePanel.dataset.order = normalized[0] === "lookup" ? "lookup-first" : "sequence-first";
      if (!persist) return;
      try {
        window.localStorage.setItem(panelOrderStorageKey, normalized.join(","));
      } catch (_) {
        // Local storage can be unavailable for some file:// browser settings.
      }
    }

    function restorePanelOrder() {
      let storedOrder = "";
      try {
        storedOrder = window.localStorage.getItem(panelOrderStorageKey) || "";
      } catch (_) {
        storedOrder = "";
      }
      applyPanelOrder(storedOrder ? storedOrder.split(",") : ["sequence", "lookup"], false);
    }

    function swapSidePanels() {

    function scrollSequenceResidueIntoView(position) {
      if (!sequenceText || !position) return;
      const target = sequenceText.querySelector(`[data-position="${position}"]`);
      if (!target) return;

      const targetRect = target.getBoundingClientRect();
      const sequenceRect = sequenceText.getBoundingClientRect();
      const topPadding = 8;
      const bottomPadding = 8;

      if (
        targetRect.top >= sequenceRect.top + topPadding
        && targetRect.bottom <= sequenceRect.bottom - bottomPadding
      ) {
        return;
      }

      const targetCenter = targetRect.top + targetRect.height / 2;
      const visibleHeight = Math.max(1, sequenceRect.height - topPadding - bottomPadding);
      const sequenceCenter = sequenceRect.top + topPadding + visibleHeight / 2;
      const maxTop = Math.max(0, sequenceText.scrollHeight - sequenceText.clientHeight);
      const nextTop = clamp(sequenceText.scrollTop + targetCenter - sequenceCenter, 0, maxTop);
      sequenceText.scrollTop = nextTop;
    }

    function scheduleSequenceResidueScroll(position) {
      if (!position) return;
      const run = () => scrollSequenceResidueIntoView(position);
      if (window.requestAnimationFrame) {
        window.requestAnimationFrame(run);
      } else {
        window.setTimeout(run, 0);
      }
    }

    function renderSequencePreview(row = null, aa = null, options = {}) {
      const mutationIndex = row && aa && aa !== row.wildType ? Number(row.index) : null;
      const focusIndex = row && (options.focusResidue || mutationIndex) ? Number(row.index) : null;
      const previewKey = focusIndex ? `${row.index}:${aa || row.wildType}:focus` : "wild";
      if (activeSequencePreviewKey === previewKey) {
        if (options.scrollToResidue && focusIndex) scheduleSequenceResidueScroll(focusIndex);
        return;

      activeSequencePreviewKey = previewKey;
      sequenceTitle.textContent = mutationIndex ? "Mutant Sequence" : "Wild-Type Sequence";

        const isMutatedResidue = position === mutationIndex;
        const isFocusedResidue = position === focusIndex;
        const displayedAa = isMutatedResidue ? aa : residue;
        const selectableAa = isMutatedResidue ? aa : (rowForPosition ? rowForPosition.wildType : residue);
        span.className = `sequence-residue${isFocusedResidue ? " focused" : ""}${isMutatedResidue ? " mutant" : ""}`;
        span.textContent = displayedAa;
        span.dataset.position = String(position);
        if (rowForPosition) {
          span.dataset.row = String(rowForPosition.index);

          ? `${row.wildType}${row.index}${aa} - click to select`
          : `${residue}${position} - click to select`;
        fragment.appendChild(span);
